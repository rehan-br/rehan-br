<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rehan Bashir — Full-stack and AI systems engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A14"/>
      <stop offset="55%" stop-color="#150F2E"/>
      <stop offset="100%" stop-color="#0A1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0"/>
      <stop offset="22%" stop-color="#7C5CFC" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B7CF6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="900" cy="140" rx="420" ry="230" fill="url(#glow)"/>

  <!-- name -->
  <text x="72" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F5F3FF" letter-spacing="-1.5">Rehan Bashir</text>
  <rect x="74" y="142" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18.5" fill="#C4B5FD" letter-spacing="0.5">full-stack + ai systems engineer</text>
  <text x="72" y="212" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7E7A9A" letter-spacing="0.3">real-time systems &#183; grounded llms &#183; data-layer authorization</text>

  <!-- telemetry trace, bottom band -->
  <path d="M0 276 L120 276 L144 258 L170 292 L198 246 L226 288 L254 268 L292 268 L318 240 L346 296 L374 262 L412 262 L438 250 L470 286 L502 266 L566 266 L592 244 L620 290 L648 264 L706 264 L736 252 L768 282 L798 268 L864 268 L892 242 L920 294 L950 262 L1014 262 L1042 280 L1074 250 L1106 272 L1200 272"
        fill="none" stroke="url(#trace)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="346" cy="296" r="4" fill="#A78BFA"/>
  <circle cx="920" cy="294" r="4" fill="#22D3EE"/>

</svg>
